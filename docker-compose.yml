services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nba
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nba_local_dev}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nba_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://nba:${POSTGRES_PASSWORD:-nba_local_dev}@db:5432/nba
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://nba:${POSTGRES_PASSWORD:-nba_local_dev}@db:5432/nba
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: qwen3.5:2b
      ALLOWED_ORIGINS: http://localhost:4300
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4300:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nba_postgres:
